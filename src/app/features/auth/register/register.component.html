<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-8">
      <div class="max-w-md w-full">
        <div class="card">
          <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">✂️ BarberQ</h1>
          <h2 class="text-xl font-semibold text-gray-700 mb-6 text-center">Créer un compte</h2>

          <!-- Role selector -->
          <div class="flex gap-3 mb-6">
            <button type="button" (click)="userForm.get('role')?.setValue('USER')"
                    [class]="role === 'USER' ? 'border-indigo-500 bg-indigo-50 text-indigo-700' : 'border-gray-200 text-gray-600'"
                    class="flex-1 py-3 border-2 rounded-xl font-medium transition-colors">
              👤 Client
            </button>
            <button type="button" (click)="userForm.get('role')?.setValue('BARBER')"
                    [class]="role === 'BARBER' ? 'border-indigo-500 bg-indigo-50 text-indigo-700' : 'border-gray-200 text-gray-600'"
                    class="flex-1 py-3 border-2 rounded-xl font-medium transition-colors">
              ✂️ Coiffeur
            </button>
          </div>

          <form (ngSubmit)="register()" [formGroup]="userForm" class="space-y-4">
            <div class="grid grid-cols-2 gap-3">
              <app-text
                type="text"
                controlName="firstName"
                label="Prénom"
                name="firstName"
                inputClass="input-field"
                placeholder="">
              </app-text>
              
              <app-text
                controlName="lastName"
                type="text"
                label="Nom"
                name="lastName"
                inputClass="input-field"
                placeholder="">
              </app-text>
            </div>
            
            <app-text
                controlName="email"
                label="Email"
                type="email"
                name="email"
                inputClass="input-field"
                placeholder="">
            </app-text>
            
            <app-text
                controlName="phone"
                label="Téléphone"
                name="phone"
                type="tel"
                inputClass="input-field"
                placeholder="">
            </app-text>
            
            <app-text
                controlName="password"
                label="Mot de passe"
                name="password"
                type="password"
                inputClass="input-field"
                placeholder="">
            </app-text>

            @if (error()) {
              <div class="bg-red-50 text-red-700 p-3 rounded-lg text-sm">{{ error() }}</div>
            }

            <button type="submit" [disabled]="loading()"
                    class="btn-primary w-full disabled:opacity-50">
              {{ loading() ? 'Inscription...' : 'Créer mon compte' }}
            </button>
          </form>

          <p class="text-center text-gray-500 text-sm mt-4">
            Déjà un compte?
            <a routerLink="/auth/login" class="text-indigo-600 hover:underline font-medium">Se connecter</a>
          </p>
        </div>
      </div>
    </div>
