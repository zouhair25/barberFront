<app-text
    [controlName]="controlName"
    label="Ville"
    [name]="controlName"
    type="text"
    inputClass="input-field"
    placeholder="">
</app-text>
@if (villes.length){
<div >
    @for (ville of villes; track ville.id) {
    <div  (click)="selectVille(ville)" style="cursor:pointer; padding:5px;">
        {{ ville.name }}
    </div>
    }
</div>
}
